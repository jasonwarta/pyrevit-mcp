[project]
name = "revit-mcp-server"
version = "1.0.0"
description = "MCP server bridging Claude Code to Autodesk Revit via pyRevit Routes"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
]
